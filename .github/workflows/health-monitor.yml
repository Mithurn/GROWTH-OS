name: Health monitor

# Opens one GitHub issue when the always-on site breaks and closes it when it recovers.
#
# The AWS backend sleeps on purpose, so an unreachable backend is NOT an incident. Only a
# backend that answers with an error (database down, app crashing) is. Set the repository
# variables below, or the defaults apply.
#   FRONTEND_URL   default https://growos-ai.vercel.app
#   BACKEND_URL    default https://growthos.duckdns.org

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  issues: write

env:
  FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://growos-ai.vercel.app' }}
  BACKEND_URL: ${{ vars.BACKEND_URL || 'https://growthos.duckdns.org' }}
  ISSUE_TITLE: 'Bug bot: production health check failing'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe frontend, demo and backend
        id: probe
        run: |
          problems=""
          probe() { curl -s -o /dev/null -w '%{http_code}' -m 20 "$1" || true; }

          code=$(probe "$FRONTEND_URL/")
          [ "$code" = 200 ] || problems="$problems- Landing page returned \`$code\` ($FRONTEND_URL/)\n"

          code=$(probe "$FRONTEND_URL/demo")
          [ "$code" = 200 ] || problems="$problems- Demo entry returned \`$code\` ($FRONTEND_URL/demo)\n"

          # 000 means no connection: the backend is asleep, which is expected.
          code=$(probe "$BACKEND_URL/health/ready")
          case "$code" in
            000|200) ;;
            *) problems="$problems- Backend is awake but unhealthy: \`$code\` ($BACKEND_URL/health/ready)\n" ;;
          esac

          echo "backend_status=$code" >> "$GITHUB_OUTPUT"
          {
            echo "problems<<EOF"
            printf '%b' "$problems"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the incident issue
        if: steps.probe.outputs.problems != ''
        uses: actions/github-script@v7
        env:
          PROBLEMS: ${{ steps.probe.outputs.problems }}
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            const body = `${process.env.PROBLEMS}\nChecked ${new Date().toISOString()}. [Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'bug-bot' });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['bug-bot'] });
            }

      - name: Close the incident issue once healthy
        if: steps.probe.outputs.problems == ''
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'bug-bot' });
            for (const issue of open.filter((i) => i.title === title)) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: 'Recovered. Closing.' });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
