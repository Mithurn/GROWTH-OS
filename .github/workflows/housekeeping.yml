name: Housekeeping

# Keeps the repository tidy: marks idle issues and pull requests stale, and deletes
# branches whose pull request has already merged.

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-message: This issue has been quiet for 45 days. It will close in 14 days unless it sees activity.
          stale-pr-message: This pull request has been quiet for 45 days. It will close in 14 days unless it sees activity.
          exempt-issue-labels: bug-bot,security,pinned
          exempt-pr-labels: dependencies,security,pinned

  prune-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const protectedNames = new Set(['main', 'master']);
            const branches = await github.paginate(github.rest.repos.listBranches, { ...context.repo, per_page: 100 });
            for (const { name } of branches) {
              if (protectedNames.has(name)) continue;
              const { data: pulls } = await github.rest.pulls.list({
                ...context.repo, state: 'closed', head: `${context.repo.owner}:${name}`, per_page: 5,
              });
              // Only delete a branch when every pull request from it merged.
              if (pulls.length > 0 && pulls.every((p) => p.merged_at)) {
                await github.rest.git.deleteRef({ ...context.repo, ref: `heads/${name}` });
                core.info(`Deleted merged branch ${name}`);
              }
            }
