name: CI

# Gate for production. Render is set to autoDeployTrigger: checksPass, so a failed
# job here blocks backend and channel deploys. The Deploy workflow runs after this
# succeeds on main and triggers Vercel/Render hooks when those secrets are set.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Real Postgres from a clean slate, running every migration. Catches migrations
      # that only fail on a fresh database, which the mocked unit suite cannot see.
      - name: Integration test
        run: npm run test:integration

      # Same reasoning as the frontend's build step below. tsc resolves modules through
      # this package's tsconfig `paths`; esbuild resolves them through the tsconfig
      # nearest each imported file. A `packages/*` file importing an npm dependency can
      # therefore typecheck clean and still fail the real Render build, which is exactly
      # what `packages/contracts` did. Runs the same script render.yaml runs.
      - name: Build
        run: npm run build

      # Same reasoning as the API build above, for the worker entrypoint that
      # runs BullMQ jobs as its own Render service (docs/V3_PLAN.md Phase 0.2).
      - name: Build worker
        run: npm run build:worker

      # esbuild silently bundles @opentelemetry/api's CJS and ESM builds as two
      # separate classes when nothing forces a single resolution — tracing then
      # "works" (no error, no crash) while every span is a disconnected no-op.
      # Only the real bundle can show this; tsc and vitest never touch esbuild's
      # module resolution. Guards the exact regression, not a proxy for it.
      - name: Verify tracing was not silently duplicated by bundling
        run: |
          for bundle in dist/server.js dist/worker.js; do
            if grep -q "ProxyTracer2" "$bundle"; then
              echo "esbuild bundled two copies of @opentelemetry/api in $bundle — tracing would silently no-op in production."
              echo "Check the --alias:@opentelemetry/api flag in package.json's build script."
              exit 1
            fi
          done

  channel-service:
    name: Channel service — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: channel-service

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: channel-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify tracing was not silently duplicated by bundling
        run: |
          if grep -q "ProxyTracer2" dist/server.js; then
            echo "esbuild bundled two copies of @opentelemetry/api — tracing would silently no-op in production."
            exit 1
          fi

  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_API_URL: https://placeholder.onrender.com/api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # tsc alone misses what actually breaks a Vercel deploy: server/client boundary
      # violations, bad metadata, and prerender failures only surface at build time.
      - name: Build
        run: npm run build

  dependency-audit:
    name: Dependency audit — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, channel-service, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Block critical runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

  repository-security:
    name: Secrets and generated artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject tracked build artifacts
        run: |
          tracked="$(git ls-files | grep -E '(^|/)(dist|build|coverage|\.next)/' || true)"
          if [ -n "$tracked" ]; then
            echo "$tracked"
            exit 1
          fi
