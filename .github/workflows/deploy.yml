name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Check the server is running
        id: server
        run: |
          . deploy/aws/lib.sh
          id=$(iid)
          if [ -n "$id" ] && [ "$(state "$id")" = running ]; then
            echo "running=true" >> "$GITHUB_OUTPUT"
          else
            echo "The server is asleep, skipping the deploy. It picks up the latest code on the next deploy/aws/push.sh."
          fi

      - name: Ship to the AWS server
        if: steps.server.outputs.running == 'true'
        run: deploy/aws/push.sh

      - name: Wait for backend health
        if: steps.server.outputs.running == 'true'
        run: |
          . deploy/aws/lib.sh
          sleep 60
          for _ in $(seq 1 40); do
            if curl -fsS -m 10 "$(site)/api/health"; then exit 0; fi
            sleep 15
          done
          exit 1
