services:
  - type: web
    name: xeno-crm-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install --include=dev && npx prisma generate --schema=prisma/schema.prisma && npx esbuild src/server.ts --bundle --platform=node --target=node18 --outfile=dist/server.js --external:pg --external:pg-native --external:bullmq --external:ioredis
    startCommand: cd backend && node dist/server.js
    envVars:
      - key: PORT
        value: 3001
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CHANNEL_SERVICE_URL
        value: "https://xeno-channel-service.onrender.com"
      - key: WEBHOOK_SECRET
        sync: false  # Set in Render dashboard — use: openssl rand -base64 32
      - key: FRONTEND_URL
        sync: false  # e.g. https://your-app.vercel.app

  - type: web
    name: xeno-channel-service
    env: node
    plan: free
    buildCommand: cd channel-service && npm install && npx esbuild src/server.ts --bundle --platform=node --target=node18 --outfile=dist/server.js
    startCommand: cd channel-service && node dist/server.js
    envVars:
      - key: PORT
        value: 5001
      - key: CRM_WEBHOOK_URL
        value: "https://xeno-crm-backend-n6d8.onrender.com/api/webhooks/channel-status"
      - key: WEBHOOK_SECRET
        sync: false  # Must match backend WEBHOOK_SECRET exactly
      - key: FAILURE_RATE
        value: 10
