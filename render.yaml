services:
  # Render's free tier grants 750 instance-hours per month shared across the whole
  # workspace. Running one service 24/7 costs ~730h, so only the backend is kept warm
  # by the keep-alive cron. The channel service is left to spin down and wakes on
  # demand at campaign launch; keeping both warm would exhaust the allowance and
  # suspend every free service until the next calendar month.
  - type: web
    name: xeno-crm-backend
    env: node
    plan: free
    repo: https://github.com/Mithurn/GROWTH-OS
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    # The bundle itself lives in backend/package.json's "build" script so that this
    # deploy and the CI build gate run byte-identical commands and cannot drift.
    buildCommand: cd backend && npm install --include=dev && npx prisma generate --schema=prisma/schema.prisma && npm run build
    preDeployCommand: cd backend && npx prisma migrate deploy --schema=prisma/schema.prisma
    startCommand: cd backend && node dist/server.js
    envVars:
      - key: PORT
        value: 3001
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false  # Required — the server refuses to boot without a reachable Redis. Upstash free tier.
      - key: CHANNEL_SERVICE_URL
        value: "https://xeno-channel-service.onrender.com"
      - key: WEBHOOK_SECRET
        sync: false  # Set in Render dashboard — use: openssl rand -base64 32
      - key: INTERNAL_API_SECRET
        sync: false  # Guards /api/internal/*, called by the agent-run cron — openssl rand -base64 32
      - key: FRONTEND_URL
        sync: false  # e.g. https://your-app.vercel.app
      - key: INTEGRATION_MASTER_KEY
        sync: false  # Encrypts saved integration keys — openssl rand -hex 32. Unset only disables saving integrations.
      - key: STRIPE_SECRET_KEY
        sync: false  # Unset disables billing — the Upgrade button is hidden client-side, checkout route errors clearly.
      - key: STRIPE_PRICE_ID
        sync: false  # Created once in the Stripe dashboard (Product catalog → Add a price)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # Signing secret from the webhook endpoint created in the Stripe dashboard
      - key: PLATFORM_RESEND_API_KEY
        sync: false  # GrowthOS's own Resend key, used only for Pro-plan tenants with no BYOK key. Optional.
      - key: PLATFORM_RESEND_FROM_EMAIL
        sync: false
      - key: PLATFORM_TWILIO_ACCOUNT_SID
        sync: false  # GrowthOS's own Twilio account, used only for Pro-plan tenants with no BYOK key. Optional.
      - key: PLATFORM_TWILIO_AUTH_TOKEN
        sync: false
      - key: PLATFORM_TWILIO_WHATSAPP_NUMBER
        sync: false

  - type: web
    name: xeno-channel-service
    env: node
    plan: free
    repo: https://github.com/Mithurn/GROWTH-OS
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    buildCommand: cd channel-service && npm install && npx esbuild src/server.ts --bundle --platform=node --target=node22 --outfile=dist/server.js
    startCommand: cd channel-service && node dist/server.js
    envVars:
      - key: PORT
        value: 5001
      - key: CRM_WEBHOOK_URL
        value: "https://xeno-crm-backend-n6d8.onrender.com/api/webhooks/channel-status"
      - key: WEBHOOK_SECRET
        sync: false  # Must match backend WEBHOOK_SECRET exactly
      - key: FAILURE_RATE
        value: 10
